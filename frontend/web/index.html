<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CyberZeus — Office Attendance Management System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CyberZeus">
  <meta name="theme-color" content="#0A1628">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>CyberZeus — Attendance System</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0A1628;
      overflow: hidden;
    }

    /* ── Splash screen ───────────────────────────────────────────────── */
    #cz-splash {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(61,148,247,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(0,194,255,0.06) 0%, transparent 60%),
                  #0A1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #cz-splash.fade-out { opacity: 0; pointer-events: none; }

    /* Glow orb behind logo */
    .cz-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }
    .cz-orb-1 {
      width: 340px; height: 340px;
      background: rgba(61,148,247,0.10);
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
    }

    /* Logo container */
    .cz-logo-wrap {
      width: 110px; height: 110px;
      border-radius: 26px;
      background: linear-gradient(135deg, #0F1E38 0%, #152844 100%);
      border: 1px solid rgba(61,148,247,0.35);
      box-shadow:
        0 0 0 1px rgba(61,148,247,0.15),
        0 20px 60px rgba(0,0,0,0.5),
        0 0 40px rgba(61,148,247,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: cz-pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
      opacity: 0;
      transform: scale(0.75);
      margin-bottom: 28px;
    }

    .cz-logo-img {
      width: 78px;
      height: 78px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(61,148,247,0.4));
    }

    /* Title */
    .cz-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      animation: cz-fade-up 0.5s ease 0.35s forwards;
      opacity: 0;
      transform: translateY(12px);
      margin-bottom: 6px;
    }
    .cz-title .cyber { color: #EEF2FF; }
    .cz-title .zeus  { color: #3D94F7; }

    /* Subtitle */
    .cz-sub {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3.5px;
      color: #4A6080;
      text-transform: uppercase;
      animation: cz-fade-up 0.5s ease 0.5s forwards;
      opacity: 0;
      transform: translateY(10px);
      margin-bottom: 52px;
    }

    /* Progress bar */
    .cz-progress-track {
      width: 180px;
      height: 2px;
      background: rgba(61,148,247,0.15);
      border-radius: 99px;
      overflow: hidden;
      animation: cz-fade-up 0.4s ease 0.6s forwards;
      opacity: 0;
      margin-bottom: 32px;
    }
    .cz-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3D94F7, #00C2FF);
      border-radius: 99px;
      animation: cz-progress 1.8s ease 0.7s forwards;
    }

    /* Powered by */
    .cz-powered {
      position: absolute;
      bottom: 36px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: #2A3F58;
      text-transform: uppercase;
      animation: cz-fade-up 0.4s ease 0.8s forwards;
      opacity: 0;
    }

    /* Keyframes */
    @keyframes cz-pop {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes cz-fade-up {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cz-progress {
      0%   { width: 0%; }
      30%  { width: 35%; }
      60%  { width: 65%; }
      85%  { width: 88%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- CyberZeus splash — shown while Flutter engine loads -->
  <div id="cz-splash">
    <div class="cz-orb cz-orb-1"></div>
    <div class="cz-logo-wrap">
      <img class="cz-logo-img" src="assets/assets/images/cyberzeus_logo.png"
           onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:44px;font-weight:900;color:#3D94F7;\'>CZ</span>';"
           alt="CyberZeus">
    </div>
    <div class="cz-title"><span class="cyber">Cyber</span><span class="zeus">Zeus</span></div>
    <div class="cz-sub">Software Systems</div>
    <div class="cz-progress-track">
      <div class="cz-progress-fill"></div>
    </div>
    <div class="cz-powered">Powered by CyberZeus</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Fade out the splash once Flutter signals first frame
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('cz-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function() { splash.remove(); }, 520);
      }
    });
  </script>
</body>
</html>
